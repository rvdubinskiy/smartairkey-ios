name: TestFlight

# Builds and uploads to TestFlight after every merge to main (a merged PR is a
# push to main). Can also be triggered manually.

on:
  push:
    branches: [main]
    paths:
      - 'SmartAirKey/**'
      - 'Vendor/**'
      - 'project.yml'
      - 'Podfile'
      - 'fastlane/**'
      - 'Gemfile'
      - '.github/workflows/testflight.yml'
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & upload to TestFlight
    # macos-15 ships Xcode 26 / the iOS 26 SDK, which App Store Connect now
    # requires for all uploads ("must be built with the iOS 26 SDK or later").
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('Podfile') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install pods
        run: pod install

      - name: Set up Ruby & fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Decode distribution certificate
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
        run: echo "$DIST_CERT_P12" | base64 --decode > dist_cert.p12

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DIST_CERT_PATH: dist_cert.p12
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
          # Backend config baked into the build (see fastlane/Fastfile).
          SAK_BASE_URL: ${{ secrets.SAK_BASE_URL }}
          SAK_COMPANY_TOKEN: ${{ secrets.SAK_COMPANY_TOKEN }}
        run: bundle exec fastlane beta

      - name: Clean up secrets
        if: always()
        run: rm -f dist_cert.p12

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ~/Library/Logs/gym
            fastlane/report.xml
          if-no-files-found: ignore
